[project]
name = "vapt-ai-v2"
version = "0.1.0"
description = "VAPT-AI V2 — authorized security-assessment platform (internal beta)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = [
    "packages/domain",
    "packages/persistence",
    "packages/llm_gateway",
    "packages/policy",
    "packages/tools",
    "packages/harness",
    "packages/skills",
    "packages/agents",
    "services/api",
    "services/orchestrator",
]
python_classes = "*Suite"  # don't collect domain StrEnums named Test* as test classes
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E712: explicit == False needed for SQLAlchemy boolean columns.
# B008: FastAPI's Depends()/Cookie() in argument defaults is the intended pattern.
ignore = ["E712", "B008"]
