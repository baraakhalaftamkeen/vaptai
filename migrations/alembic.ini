# Alembic config. The DB URL is injected from the VAPT_DATABASE_URL env var in env.py,
# so no credentials live in this file.
[alembic]
script_location = %(here)s
prepend_sys_path = ../packages/domain:../packages/persistence
version_locations = %(here)s/versions

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
